server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard (static files)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: the browser calls /api/... on the same origin,
    # Nginx forwards it to the "api" container on the Compose network.
    # "api" is the service name from docker-compose.yml (Docker DNS).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
